name: release-tpu
# Релиз стенда «Мой ТПУ» для сервера ТПУ: проверки → образы gateway/rag/assistant (amd64+arm64 в GHCR по digest)
# → смоук на готовых контейнерах и маршрутах Caddy → GitHub Release с манифестом и файлами выкладки.
# Сервер забирает релиз сам (deploy/tpu-server/README.md). Отдельный VPS assistant — ci-cd-ai-backend.yml.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "shared/**"
      - "console/**"
      - "deploy/**"
      - "pom.xml"
      - ".github/workflows/release-tpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tpu
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  CADDY_VERSION: 2.11.9

jobs:
  verify:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование проекта с историей
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Образ закреплён по digest; gitleaks-action не берём — для организаций он требует лицензию
      - name: Поиск секретов во всей истории
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --no-banner --exit-code 1

      - name: Установка JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Сборка и проверка всех модулей
        run: mvn -B -ntp verify

      - name: Сценарии установки и обновления
        run: |
          bash deploy/tpu-server/test/install-scenarios.sh
          bash deploy/tpu-server/test/update-scenarios.sh

      - name: Проверка версии Node
        run: |
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (a < 20 || (a === 20 && b < 19)) { console.error("Angular 22 требует Node >= 20.19, сейчас " + process.versions.node); process.exit(1) }'

      - name: Сборка консоли (production)
        working-directory: console
        run: |
          npm ci
          npx ng build

  images:
    name: Сборка и смоук (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Публикация — только из защищённой main: ручной запуск с другой ветки прогоняет проверки, но не публикует
    if: github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      GATEWAY_IMAGE: mytpu/gateway:smoke
      RAG_IMAGE: mytpu/rag:smoke
      ASSISTANT_IMAGE: mytpu/assistant:smoke
    steps:
      - name: Клонирование проекта
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установка JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Jar-файлы для образов
        run: mvn -B -ntp -DskipTests package

      - name: Сборка консоли (production)
        working-directory: console
        run: |
          npm ci
          npx ng build

      - name: Сборщик buildx
        run: docker buildx create --name mytpu --driver docker-container --use

      - name: Образы для проверки на нативном раннере
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            -f deploy/docker/spring.Dockerfile --build-arg MODULE=services/gateway \
            -t "$GATEWAY_IMAGE" .
          docker buildx build --platform "linux/$ARCH" --load \
            -f deploy/docker/spring.Dockerfile --build-arg MODULE=services/rag/rag-app \
            -t "$RAG_IMAGE" .
          docker buildx build --platform "linux/$ARCH" --load \
            -f deploy/docker/spring.Dockerfile --build-arg MODULE=services/assistant \
            --build-arg TRAINING_ENV="ML_BASE_URL=http://localhost/v1 ML_API_KEY=training ML_CHAT_MODEL=training" \
            -t "$ASSISTANT_IMAGE" .

      - name: Сканирование образов (критичные уязвимости с исправлением — стоп)
        run: |
          for image in "$GATEWAY_IMAGE" "$RAG_IMAGE" "$ASSISTANT_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --no-progress --exit-code 1 --severity CRITICAL --ignore-unfixed "$image"
          done

      - name: Комплект файлов выкладки
        run: |
          mkdir -p dist/postgres/init
          cp deploy/tpu-server/compose.yml deploy/tpu-server/Caddyfile dist/
          cp deploy/postgres/init/01-databases.sh dist/postgres/init/
          tar -czf dist/console.tar.gz -C console/dist/console/browser .

      # Caddy нужен смоуку: версия закреплена, архив сверяется по контрольной сумме из релиза Caddy
      - name: Установка Caddy для смоука
        run: |
          archive="caddy_${CADDY_VERSION}_linux_${ARCH}.tar.gz"
          base="https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION"
          curl -fsSL -o "/tmp/$archive" "$base/$archive"
          curl -fsSL -o /tmp/caddy.sums "$base/caddy_${CADDY_VERSION}_checksums.txt"
          # Имя архива сверяется с файлом контрольных сумм, а не берётся на веру
          line="$(grep -E "  ${archive}\$| \*${archive}\$" /tmp/caddy.sums || true)"
          [ -n "$line" ] || { echo "в контрольных суммах Caddy нет $archive"; exit 1; }
          (cd /tmp && printf '%s\n' "$line" | sha512sum -c -) || { echo "контрольная сумма $archive не сошлась"; exit 1; }
          tar -xzf "/tmp/$archive" -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy
          caddy version

      # Конфиг маршрутов и матрица отказов проверяются отдельно и раньше: заглушки сервисов занимают те же порты
      - name: Проверка конфига маршрутов и отказов
        run: bash deploy/tpu-server/smoke-routes.sh --console-dir console/dist/console/browser

      - name: Смоук готовых контейнеров и маршрутов
        run: |
          model_dir="$(mktemp -d)"
          trap 'rm -rf "$model_dir"' EXIT
          model="https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          curl -fsSL --retry 3 --max-time 300 "$model/onnx/model_quantized.onnx" -o "$model_dir/model.onnx"
          curl -fsSL --retry 3 --max-time 60 "$model/tokenizer.json" -o "$model_dir/tokenizer.json"
          chmod 755 "$model_dir"
          bash deploy/tpu-server/smoke-stack.sh --release dist --console-dir console/dist/console/browser --model-dir "$model_dir"

      # Без авторизации buildx не загрузит образы: логин строго перед публикацией
      - name: Логин в GHCR перед публикацией
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Загрузка проверенных образов в GHCR
        run: |
          mkdir -p digests
          push() {
            local service="$1" local_image="$2" ref output digest
            ref="$IMAGE_PREFIX/$service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
            docker tag "$local_image" "$ref"
            output="$(docker push "$ref")"
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<< "$output")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$digest" > "digests/$service.digest"
          }
          push gateway "$GATEWAY_IMAGE"
          push rag "$RAG_IMAGE"
          push assistant "$ASSISTANT_IMAGE"

      - name: Digest проверенной платформы
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          overwrite: true

      - name: Проверенный комплект выкладки
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpu-deploy-files
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Индексы образов и релиз
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Клонирование проекта
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версия релиза
        run: echo "VERSION=v$(git show -s --format=%cd --date=format:%Y%m%d "$GITHUB_SHA")-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Загрузка digest проверенных образов
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: verified

      - name: Загрузка проверенного комплекта выкладки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tpu-deploy-files
          path: dist

      - name: Логин в GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Индексы из проверенных образов
        run: |
          mkdir -p build
          for service in gateway rag assistant; do
            image="$IMAGE_PREFIX/$service"
            amd64="$(cat "verified/digests-amd64/$service.digest")"
            arm64="$(cat "verified/digests-arm64/$service.digest")"
            ref="$image:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker buildx imagetools create -t "$ref" "$image@$amd64" "$image@$arm64"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$digest" > "build/$service.digest"
          done

      - name: Манифест релиза
        run: |
          bash deploy/tpu-server/release-manifest.sh --out dist --version "$VERSION" --source-sha "$GITHUB_SHA" \
            --gateway "$IMAGE_PREFIX/gateway@$(cat build/gateway.digest)" \
            --rag "$IMAGE_PREFIX/rag@$(cat build/rag.digest)" \
            --assistant "$IMAGE_PREFIX/assistant@$(cat build/assistant.digest)"

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/release.json dist/SHA256SUMS dist/compose.yml dist/Caddyfile dist/console.tar.gz dist/01-databases.sh"
          if [ "$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = false ]; then
            gh release view "$VERSION" --json tagName,url --jq '"релиз уже опубликован: \(.tagName) \(.url)"'
            exit 0
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" $files --clobber
          gh release edit "$VERSION" --draft=false
          gh release view "$VERSION" --json tagName,url --jq '"релиз: \(.tagName) \(.url)"'
