name: ci-cd-ai-backend-pipeline
on:
  push:
    branches:
      - main
      - feature/backend-skeleton
    paths:
      - "backend-java/ai-backend/**"
      - ".github/workflows/ci-cd-ai-backend.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование проекта
        uses: actions/checkout@v4

      - name: Установка JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка проекта
        run: mvn clean package -pl :ai-backend -am

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Получение repository_owner в нижнем регистре
        id: img
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/ai-backend" >> $GITHUB_OUTPUT

      - name: Сборка образа
        run: docker build -f backend-java/ai-backend/Dockerfile -t ${{steps.img.outputs.name}}:latest backend-java/ai-backend

      - name: Выгрузка образа на GHCR
        run: docker push ${{steps.img.outputs.name}}:latest

      - name: Копирование docker-compose.backend-java на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_KEY}}
          source: "docker/docker-compose.backend-java.yml"
          target: "/home/${{ secrets.VPS_USER }}/SL"
          strip_components: 1

      - name: Деплой сервиса через SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_KEY}}
          script: |
            cd /home/${{ secrets.VPS_USER }}/SL
            
            echo "${{secrets.GHCR_TOKEN}}" | docker login ghcr.io -u "${{secrets.GHCR_USERNAME}}" --password-stdin
            
            docker compose -f docker-compose.backend-java.yml pull ai-backend
            
            docker compose -f docker-compose.backend-java.yml up -d ai-backend
            
            docker image prune -f
            




