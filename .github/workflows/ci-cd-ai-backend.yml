name: ci-cd-ai-backend-pipeline
# assistant: проверки → образ (тег = SHA) → trivy → GHCR → деплой на VPS (только при vars.ASSISTANT_DEPLOY_ENABLED == 'true').
# Порядок выкладки и перенос секретов на сервере — deploy/README.md.
on:
  push:
    branches:
      - main
    paths:
      - "services/assistant/**"
      - "pom.xml"
      - "services/pom.xml"
      - "deploy/docker/spring.Dockerfile"
      - "deploy/compose.server.yml"
      - ".github/workflows/ci-cd-ai-backend.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mytpu/ai-backend

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование проекта с историей
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Поиск секретов во всей истории
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --no-banner --exit-code 1

  build:
    needs: secrets
    runs-on: ubuntu-latest
    # Запись в GHCR — только этой задаче
    permissions:
      contents: read
      packages: write
    steps:
      - name: Клонирование проекта
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Установка JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Сборка и проверка assistant
        run: mvn -B -ntp clean verify -pl services/assistant -am

      - name: Сборка образа
        run: >-
          docker build -f deploy/docker/spring.Dockerfile
          --build-arg MODULE=services/assistant
          --build-arg TRAINING_ENV="ML_BASE_URL=http://localhost/v1 ML_API_KEY=training ML_CHAT_MODEL=training"
          -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Сканирование образа (критичные уязвимости с исправлением — стоп)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --no-progress --exit-code 1 --severity CRITICAL --ignore-unfixed "${IMAGE}:${GITHUB_SHA}"

      - name: Логин в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Выгрузка образа на GHCR
        run: docker push "${IMAGE}:${GITHUB_SHA}"

  deploy:
    needs: build
    # Выключено, пока владелец VPS не перенёс .env в secrets/ (deploy/README.md)
    if: vars.ASSISTANT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Окружение production: секреты VPS — его секреты, выкладка ждёт подтверждения ревьюера (Settings → Environments)
    environment: production
    # Две выкладки подряд не идут одновременно (общий assistant.tag и порт)
    concurrency:
      group: deploy-assistant
      cancel-in-progress: false
    steps:
      - name: Клонирование проекта
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Копирование compose.server.yml на сервер
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "deploy/compose.server.yml"
          target: "/home/${{ secrets.VPS_USER }}/SL"
          strip_components: 1

      - name: Выкладка с проверкой здоровья и откатом
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_TAG
          script: |
            set -eu
            cd "$HOME/SL"
            # Токен не остаётся в ~/.docker/config.json после выкладки
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            compose() { docker compose --env-file server.env -f compose.server.yml "$@"; }
            previous="$(cat assistant.tag 2>/dev/null || true)"
            compose pull assistant
            # Старый контейнер из docker-compose.backend-java.yml держит тот же порт
            docker rm -f ai-backend >/dev/null 2>&1 || true
            healthy=""
            # Падение самого запуска (нет файла секрета и т. п.) тоже ведёт к откату, а не обрывает скрипт по set -e
            if compose up -d assistant; then started=1; else started=""; fi
            for i in $(seq 1 30); do
              [ -n "$started" ] || break
              if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then healthy=1; break; fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "assistant ${IMAGE_TAG} не поднялся"
              if [ -n "$previous" ]; then IMAGE_TAG="$previous" compose up -d assistant; echo "откат на ${previous}"; fi
              exit 1
            fi
            printf '%s' "$IMAGE_TAG" > assistant.tag
            docker image prune -f
