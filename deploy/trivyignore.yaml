# Исключения trivy (CI ci-build.yml, задача pgvector; deploy/test-server/pack.sh). Каждое — с причиной и сроком:
# после expired_at исключение перестаёт действовать и проверка снова останавливает сборку.
vulnerabilities:
  # gosu в образе pgvector собран Go 1.24.6; исправить может только апстрим. gosu работает только при старте
  # контейнера (смена пользователя) и TLS не использует — уязвимость crypto/tls недостижима. Решение владельца 2026-11-07
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    expired_at: 2027-02-01
    statement: "gosu не устанавливает TLS-соединений; ждём пересборки образа pgvector с Go >= 1.24.13"
