# Оверлей поверх compose.dev.yml для тестового сервера Сбера.
# Запуск на сервере (из каталога ~/mytpu/deploy):
#   docker compose --env-file test-server/server.env -f compose.dev.yml -f compose.test-server.yml up -d --no-build postgres rag gateway assistant
#
# Зачем:
# 1. pull_policy: never — сервисы используют локальные образы, загруженные из архива mytpu-images.tar.gz (на сервере ничего не компилируется).
# 2. Сеть edge фиксирует подсеть ${EDGE_SUBNET} (по умолчанию 172.31.240.0/24). Адрес шлюза этой сети (172.31.240.1)
#    детерминирован и указан в TRUSTED_PROXIES. Именно с этого адреса Docker передаёт в контейнер соединения с хоста
#    (Caddy → 127.0.0.1:8081, SSH-туннель → 127.0.0.1:18090).
# 3. Консоль администратора (/admin/api/**, /internal/**) — только на отдельном порту шлюза 8090 (на хосте 127.0.0.1:18090):
#    - на основном порту (8081) эти пути — всегда 404, какой бы X-Forwarded-For ни пришёл; Caddy их и так не проксирует;
#    - на порту консоли решает адрес соединения (не заголовок): пускается только шлюз сети edge, то есть соединения
#      с хоста через опубликованный порт; соседние контейнеры сети edge (assistant) приходят со своих адресов — 404;
#    - вход — SSH-туннель 18090 → 127.0.0.1:18090 (deploy/test-server/console.sh, proxy.tunnel.json).
# 4. assistant обращается к ml-server по его публичному адресу (${ML_BASE_URL}), так как loopback хоста из контейнера недоступен.

services:
  rag:
    pull_policy: never

  rag-ingest:
    pull_policy: never

  gateway:
    pull_policy: never
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES — адрес шлюза сети edge в server.env (например 172.31.240.1/32)}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?GATEWAY_PUBLIC_URL — публичный адрес шлюза в server.env (https://${MYTPU_HOST})}
      # Порт консоли публикуется в compose.dev.yml (127.0.0.1:18090:8090); пускаются только соединения с хоста
      ADMIN_ALLOWED_NETWORKS: ${EDGE_GATEWAY:-172.31.240.1}/32
      # На стенде только ключи v2 (с контрольной суммой): случайные строки формата v1 не доходят до поиска в БД
      V1_KEYS_UNTIL: "2026-10-01"

  assistant:
    pull_policy: never
    environment:
      ML_BASE_URL: ${ML_BASE_URL:?ML_BASE_URL — публичный адрес ml-server с /v1 в server.env}
      ML_CHAT_MODEL: ${ML_CHAT_MODEL:-tpu-assistant}
      # Без доверенного прокси все клиенты чата приходят с адреса шлюза сети edge и делят один лимит на адрес
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES — адрес шлюза сети edge в server.env}
    # /api/ai/* открыт наружу через Caddy: без ключа клиента (заголовок X-Assistant-Key) любой тратил бы квоту модели.
    # Файл создаёт up.sh; пустой файл выключил бы проверку — up.sh этого не допускает.
    secrets: [ml_api_key, assistant_client_key, assistant_gateway_key]

secrets:
  assistant_client_key: {file: ./secrets/assistant_client_key}

networks:
  edge:
    ipam:
      driver: default
      config:
        - subnet: ${EDGE_SUBNET:-172.31.240.0/24}
  # Фиксированная подсеть core: ключ chat.service помощника выдаётся только с сетями (--networks=${CORE_SUBNET})
  core:
    ipam:
      driver: default
      config:
        - subnet: ${CORE_SUBNET:-172.31.241.0/24}
