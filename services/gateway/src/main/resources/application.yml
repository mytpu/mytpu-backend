server:
  port: ${PORT:8080}
  # Адрес клиента — только из ClientAddress (доверенные прокси); Spring/Tomcat сами X-Forwarded-For не применяют
  forward-headers-strategy: none
  tomcat:
    # Лишние запросы ждут в очереди, а не создают нагрузку (машина 4 ядра / 4 ГБ)
    max-connections: 200
    accept-count: 50
    # Медленные клиенты не держат соединения: заголовки — за 5 с
    connection-timeout: 5s

spring:
  application:
    name: gateway
  # Секреты — файлы: в контейнере /run/secrets/, локально SECRETS_DIR=deploy/secrets/
  config:
    import: "optional:configtree:${SECRETS_DIR:/run/secrets/}"
  threads:
    virtual:
      enabled: true
  # Загрузки в консоль rag проходят прокси потоком: тело не разбирается шлюзом (иначе поток уже прочитан)
  servlet:
    multipart:
      enabled: false
  messages:
    basename: messages,tools/descriptions
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    # Ответы и сообщения валидации — на русском, независимо от локали сервера
    locale: ru
    locale-resolver: fixed
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:postgresql://postgres:5432/gateway}
    username: gateway
    password: ${gateway_db_password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    schemas: gateway
    default-schema: gateway

management:
  endpoints:
    web:
      exposure:
        include: health

mytpu:
  # API консоли (/admin/api/**) — только с этих сетей; до входа через ТПУ — localhost (SSH-туннель)
  admin:
    allowed-networks: ${ADMIN_ALLOWED_NETWORKS:127.0.0.1/32,::1/128}
  # Коннекторы из консоли: свои запрещённые сети (сети Docker вне частных диапазонов), сверка публикаций между экземплярами
  connectors:
    denied-networks: ${CONNECTORS_DENIED_NETWORKS:}
    refresh: 30s
  gateway:
    # Инструменты и интеграция-образец для разработки (system_ping); в проде выключено
    dev-tools: false
    docs:
      url: ${RAG_URL:http://rag:8080}
    # Лимиты инструментов: срок кэша, таймаут, вызовов в минуту на клиента
    tools:
      limits:
        docs_search: {cache-ttl: 1h, timeout: 6s, rate-per-minute: 60}
        rasp_find: {cache-ttl: 10m, timeout: 10s, rate-per-minute: 60}
        system_ping: {timeout: 2s, rate-per-minute: 60}
    limits:
      client-calls-per-minute: 600
    access:
      max-failures-per-minute: 30
      # То же по широкой подсети (/24 IPv4, /48 IPv6): у кого IPv6 /48, у того 65 536 адресов /64
      max-failures-per-subnet-per-minute: 300
      # Одновременных запросов /mcp на ключ; сверх — 429 too_many_concurrent
      max-concurrent-per-key: 8
      # Одновременных запросов /chat на сервисный ключ помощника (один ключ на всех студентов)
      max-concurrent-chat: 64
      # Поисков ключа в БД в секунду (не из кэша); сверх — 503 key_lookup_busy без БД
      max-key-lookups-per-second: 50
      # Ключи v1 (без контрольной суммы) принимаются до этой даты (ГГГГ-ММ-ДД); пусто — без срока
      v1-keys-until: ${V1_KEYS_UNTIL:}
    # Прокси, которым верим в X-Forwarded-For (CIDR через запятую): только адрес контейнера caddy (/32), не вся сеть.
    # Пусто — никому
    trusted-proxies: ${TRUSTED_PROXIES:}
    # Признак утечки: больше N разных подсетей у ключа за час → server приостанавливается, person — событие
    key-watch:
      max-networks-per-hour: 3
      max-events-per-minute: 20
      # Одновременных фоновых записей учёта; лишние отбрасываются
      background-writes: 2
    # Жизненный цикл мастер-ключей (сроки, неактивность, напоминания, самоперевыпуск)
    keys:
      # Сроки действия по типам ключей: по умолчанию и максимум (в днях)
      ttl:
        person: {default-days: 30, max-days: 90}
        server: {default-days: 90, max-days: 365}
        demo: {default-days: 7, max-days: 14}
      # Предел срока ключа без указания сетей (в днях)
      max-days-without-networks: 30
      # Срок действия ключа-ловушки (в днях)
      decoy-days: 365
      # Приостановка ключа после неактивности
      inactive-after: 45d
      # Отзыв ни разу не использованного ключа через этот срок; не задано — выключено
      # revoke-unused-after: 14d
      # Дни до конца срока ключа для предупреждений
      expiry-warn-days: [14, 3]
      # Переходный срок старого ключа при самоперевыпуске
      self-rotate-grace: 24h
      # Минимальный интервал между самоперевыпусками
      self-rotate-every: 1d
      # Расписание ночной проверки неактивности и истечения ключей
      housekeeping-cron: "0 15 4 * * *"
      # Ограничение по странам: база DB-IP Country Lite (CC BY 4.0, «IP Geolocation by DB-IP», обновлять раз в месяц)
      geo:
        enabled: ${KEY_GEO_ENABLED:false}
        db-path: ${KEY_GEO_DB:/geo/dbip-country-lite.mmdb}
        allowed-countries: [RU]
        unknown-event-every: 1h
        error-log-every: 10m
      # Оповещения о событиях ключей (ловушки, группы, всплески подсетей, истечение, вызов из-за рубежа)
      # Подключение Telegram:
      #   в файл deploy/secrets/key_alert_webhook записать https://api.telegram.org/bot<токен>/sendMessage
      #   в chat-id указать id чата команды
      alerts:
        events: [key.decoy_used, key.group_suspended, key.network_burst, key.expiring, key.self_rotated, key.foreign_country]
        chat-id: ""
        timeout: 5s
        repeat-after: 10m
    mcp:
      max-body-bytes: 65536
      # Origin страниц, которым можно звать /mcp из браузера (через запятую); пусто — никому. Без Origin — как раньше
      allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    # Адрес шлюза для команды claude mcp add в консоли
    public-url: ${GATEWAY_PUBLIC_URL:http://127.0.0.1:8081}
    # Выдача личного внешним агентам (specs/personal-data-for-agents)
    personal:
      # full внешнему агенту — только после решения вуза о зарубежных провайдерах (вопросы 3 и 17 в docs/SECURITY.md)
      external-full-allowed: false
      full-without-dpop-max: 1d
      max-records-per-day: 200
      cache-ttl-max: 60s
      taint-window: 30m
      # Карточка «Мой ТПУ» для режима reference (спецификация 7); пусто — фраза без ссылки
      card-url: ${PERSONAL_CARD_URL:}
      disclosure-retention: 365d
