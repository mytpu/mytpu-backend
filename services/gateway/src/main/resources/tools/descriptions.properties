# Описания инструментов для модели и подсказки к аргументам: <инструмент>.description, <инструмент>.arg.<поле>.
# Коротко, с примером вызова — так их понимает и слабая модель (docs/LLM.md, раздел 2).

system_ping.description=Проверка связи со шлюзом. Пример: {"text": "привет"}
system_ping.arg.text=Любой текст — вернётся в ответе

system_echo.description=Повторяет текст. Пример: {"text": "эхо"}
system_echo.arg.text=Текст для повтора

docs_search.description=Ищет ответ в документах ТПУ: статьи поддержки и страницы сайта (справки, общежития, стипендии, переводы, Moodle, учётная запись). Вопрос — на русском, одной фразой. Пример: {"query": "как получить справку об обучении"}
docs_search.arg.query=Вопрос на русском, понятный без истории диалога, до 200 символов
docs_search.arg.limit=Сколько документов вернуть, от 1 до 5; по умолчанию 3

rasp_find.description=Ищет в расписании ТПУ аудиторию, преподавателя или группу и показывает, где это. Пример: {"query": "403"} или {"query": "Иванов"}
rasp_find.arg.query=Номер аудитории, фамилия преподавателя или номер группы
