# Тексты шлюза для клиентов и модели. Ошибка — это инструкция: что сказать пользователю или как исправить вызов (docs/LLM.md).
mcp.instructions=Шлюз «Мой ТПУ»: поиск по документам университета и поиск аудиторий, преподавателей и групп в расписании ТПУ (со ссылкой на расписание; пары по дням пока недоступны). Отвечай пользователю по полям summary и data из ответа инструмента. Если инструмент вернул вопрос с вариантами — задай этот вопрос пользователю и вызови инструмент снова с выбранным вариантом.

