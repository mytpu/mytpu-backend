# Тексты шлюза для клиентов и модели. Ошибка — это инструкция: что сказать пользователю или как исправить вызов (docs/LLM.md).
mcp.instructions=Шлюз «Мой ТПУ»: поиск по документам университета и поиск аудиторий, преподавателей и групп в расписании ТПУ (со ссылкой на расписание; пары по дням пока недоступны). Отвечай пользователю по полям summary и data из ответа инструмента. Если инструмент вернул вопрос с вариантами — задай этот вопрос пользователю и вызови инструмент снова с выбранным вариантом.

error.tool_not_found=Такого инструмента нет. Список доступных инструментов — в tools/list.
error.tool_disabled=Инструмент сейчас выключен администратором. Скажи пользователю, что эта функция временно недоступна.
error.tool_not_allowed=Этот инструмент не входит в разрешения вашего ключа. Обратитесь к администратору шлюза.
error.tool_not_allowed.personal=Для личных данных нужен вход пользователя ТПУ; с ключом без пользователя они недоступны.
error.tool_not_allowed.read_only=Ключ выдан только для чтения: инструменты записи ему недоступны.
error.tool_not_allowed.mcp_write=Прямая запись через MCP недоступна: запись — только черновиком с подтверждением человеком на сайте «Мой ТПУ».
error.write_unavailable=Запись через шлюз пока недоступна: работают только инструменты чтения.
error.gateway_mode.internal_only=Шлюз временно закрыт для внешних клиентов. Скажи пользователю, что сервис недоступен, и предложи повторить позже.
error.gateway_mode.read_only=Шлюз временно работает только на чтение.
error.rate_limited=Слишком много вызовов этого инструмента за минуту. Подожди минуту и повтори.
error.invalid_arguments=Неверные аргументы — {0}. Исправь аргументы и вызови инструмент ещё раз.
error.invalid_arguments.type=поле {0} имеет неверный тип или формат
error.invalid_arguments.json=аргументы должны быть объектом JSON
error.not_found=Ничего не найдено. Уточни запрос у пользователя.
error.upstream_error=Сервис ТПУ ответил ошибкой. Предложи пользователю повторить позже.
error.upstream_unavailable=Сервис ТПУ сейчас недоступен. Скажи пользователю, что данные временно недоступны, и предложи повторить позже.
error.upstream_timeout=Сервис ТПУ не ответил вовремя. Предложи пользователю повторить запрос чуть позже.
error.internal_error=Внутренняя ошибка шлюза. Предложи повторить позже; если повторяется — сообщить администратору.

