server:
  port: ${PORT:8080}
  # Адрес клиента — только из ClientAddress (доверенные прокси), Tomcat сам X-Forwarded-For не применяет
  forward-headers-strategy: none

spring:
  application:
    name: assistant
  # Секреты — файлы: в контейнере /run/secrets/, локально SECRETS_DIR=deploy/secrets/
  config:
    import: "optional:configtree:${SECRETS_DIR:/run/secrets/}"
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  ai:
    openai:
      # ml-server, OpenAI-совместимый; адрес с /v1 (например https://host/v1) — Spring AI 2 дописывает только /chat/completions.
      # Без адреса, ключа или модели assistant не стартует (запасных имён SPRING_AI_OPENAI_* больше нет)
      base-url: ${ML_BASE_URL:}
      # Ключ — из файла-секрета ml_api_key; переменная ML_API_KEY оставлена для запуска без Docker
      api-key: ${ml_api_key:${ML_API_KEY:}}
      # Таймаут попытки и один повтор (SDK OpenAI повторяет и 429, и 5xx). Настройки chat.* перекрывают общие —
      # задаём оба уровня; обычный ответ дополнительно ограничен mytpu.chat.timeout
      timeout: ${ML_TIMEOUT:60s}
      max-retries: 1
      chat:
        timeout: ${ML_TIMEOUT:60s}
        max-retries: 1
        options:
          model: ${ML_CHAT_MODEL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mytpu:
  chat:
    max-message-chars: 4000
    max-body-bytes: 16384
    timeout: 60s
    stream-idle-timeout: 30s
    max-concurrent: 4
    per-ip-per-minute: 20
    # Прокси перед assistant (CIDR или адреса через запятую); пусто — X-Forwarded-For не учитывается
    trusted-proxies: ${TRUSTED_PROXIES:}
