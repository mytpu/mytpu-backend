server:
  port: ${PORT:8080}

spring:
  application:
    name: assistant
  # Секреты — файлы: в контейнере /run/secrets/, локально SECRETS_DIR=deploy/secrets/
  config:
    import: "optional:configtree:${SECRETS_DIR:/run/secrets/}"
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      # ml-server, OpenAI-совместимый; адрес с /v1 (например https://host/v1) — Spring AI 2 дописывает только /chat/completions
      # Старые SPRING_AI_OPENAI_* (в старом коде перепутаны местами) — запасной вариант до правки .env на сервере
      base-url: ${ML_BASE_URL:${SPRING_AI_OPENAI_API_KEY:}}
      # Ключ — из файла-секрета ml_api_key; переменная ML_API_KEY оставлена для запуска без Docker
      api-key: ${ml_api_key:${ML_API_KEY:${SPRING_AI_OPENAI_BASE_URL:}}}
      chat:
        options:
          model: ${ML_CHAT_MODEL:${SPRING_AI_CHAT_MODEL:}}
