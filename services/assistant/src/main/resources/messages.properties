# Тексты ошибок чата (specs/prod-hardening-after-review)
chat.error.bad_request=Запрос не разобран: нужен JSON вида {"message": "текст вопроса"}.
chat.error.message_required=Напишите вопрос: поле message не может быть пустым.
chat.error.message_too_long=Вопрос слишком длинный — сократите его.
chat.error.rate_limited=Слишком много запросов. Подождите минуту и повторите.
chat.error.busy=Помощник сейчас занят другими вопросами. Повторите через минуту.
chat.error.unauthorized=Нужен ключ клиента чата (заголовок X-Assistant-Key).
chat.error.upstream_timeout=Модель не ответила вовремя. Повторите вопрос чуть позже.
chat.error.upstream_unavailable=Модель сейчас недоступна. Повторите вопрос чуть позже.
chat.error.tool_unavailable=Инструмент временно недоступен. Повторите запрос позже.

# Тексты шаблонов прямого пути (specs/assistant/spec.md, шаг 8)
chat.direct.greeting=Здравствуйте! Я цифровой помощник Томского политехнического университета. Могу подсказать расписание пар, расположение аудиторий и корпусов, а также информацию по документам и сервисам ТПУ.
chat.direct.other=Я отвечаю только на вопросы об учебе и жизни в Томском политехническом университете: расписание, корпуса, аудитории, регламенты и сервисы ТПУ. Пожалуйста, задайте вопрос по университету.
chat.direct.more=Подробнее:

# Шаблоны пути с моделью: ответ из данных, когда модель не ответила или ответ не сошёлся с данными (spec 5, шаг 10)
chat.template.docs=Вот что сказано в документах ТПУ:\n«{0}»\n\nИсточник: {1} — {2}
chat.template.docs_no_link=Вот что сказано в документах ТПУ:\n«{0}»\n\nИсточник: {1}
chat.template.not_found=Не нашёл ответа в документах и расписании ТПУ. Обратитесь в Единый деканат своей школы или задайте вопрос в службу поддержки help.tpu.ru.
chat.template.clarify=Уточните, пожалуйста, вопрос: назовите группу, фамилию преподавателя, аудиторию с корпусом или документ, который нужен.
